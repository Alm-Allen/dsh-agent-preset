name: Publish npm

# 推一个 v* 标签，把它发到 npm。
#
# 与 release.yml 分工：那条只建 GitHub Release，这条只发 npm。两条都挂在同一个标签上，
# 谁先谁后互不牵制，也不会因为一方失败把另一方带下去。
#
# 发布前置（在 npm 网站上做一次，之后不用再动）：包的 Settings → Trusted publishing
# 填 GitHub 仓库 Alm-Allen/dsh-agent-preset 与 workflow 文件名 publish.yml。
# 之后 CI 用 OIDC 换短期凭据，仓库里不放 NPM_TOKEN，发布的包还带 provenance。
# 不想用 trusted publishing 的话，把最后一步换成 `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}`
# 并在仓库 Settings → Secrets 里存一个 npm 自动化令牌。
#
# 本包零构建：`plugins/` 与 `cordis.patch.yml` 就是产物，所以这里没有构建步骤。
# 发布前的离线自测由 package.json 的 prepublishOnly 跑，npm publish 会自动触发它。
#
# 版本必须是合法 semver：日期式版本要去掉前导零（`2026.11.03` 会被 npm 清理成
# `2026.11.3` 并给警告），标签必须与 package.json 的 version 逐字相同。

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # trusted publishing 与 provenance 都要 OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # setup-node 带的 npm 是 10.x，trusted publishing 要求 11.5.1 以上
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 安装运行依赖
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: 标签与版本：逐字一致且是合法 semver
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          echo "标签 $GITHUB_REF_NAME / package.json $version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 的 version $version 不一致"
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::version $version 不是合法 semver（各段不许有前导零）"
            exit 1
          fi

      - name: 包内容自检
        run: |
          set -e
          npm pack --dry-run --json > pack.json
          node -e "
          const p = require('./pack.json');
          const entries = Array.isArray(p) ? p : Object.values(p);
          const files = (entries[0]?.files ?? []).map(f => f.path);
          const need = ['LICENSE', 'package.json', 'README.md', 'cordis.patch.yml', 'locale/zh.json', 'locale/en.json', 'plugins/agent-preset.mjs', 'plugins/client.js', 'plugins/yayan-zh.mjs'];
          const miss = need.filter(n => !files.includes(n));
          if (miss.length) { console.error('tarball 缺少: ' + miss.join(', ')); process.exit(1); }
          const leaked = files.filter(f => f.startsWith('文档/') || f.startsWith('.github/') || f.startsWith('node_modules/') || f === 'AGENTS.md');
          if (leaked.length) { console.error('tarball 混进了不该发的东西: ' + leaked.join(', ')); process.exit(1); }
          console.log('tarball OK：' + files.length + ' 个文件');
          "

      - name: 发布到 npm
        run: npm publish --access public --provenance
