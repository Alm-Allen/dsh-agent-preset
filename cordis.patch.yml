# Chat 模式不是汉化，而是把原生 minimal 换成零工具、零系统提示词的纯对话组合。
# 主插件开启 chat 时先停用 preset-minimal，再启用这个同 config.id 的 preset-chat。
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: true
      config:
        id: minimal
        order: 3
        name: 'Chat 模式'
        description: '纯对话模式：零工具、零系统提示词注入。预设不挂任何工具行，并在自身 scope 内摘掉宿主全局层与 Agent 作用域注入的工具和上下文；persona 以空前缀作为唯一系统提示词段落，同时关闭运行时上下文快照。'
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: ''
              complete: true
              includeRuntimeContext: false
          - id: no-global-tools
            name: '@alm-allen/dsh-preset-pack/no-global-tools'
          - id: zero-injection
            name: '@alm-allen/dsh-preset-pack/zero-injection'
