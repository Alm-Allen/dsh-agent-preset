        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
          # 唯一的自建行：每次组装把系统提示词收敛成上面那一句，并把共用执行政策与 PTC 工具说明
          # 放进第一个 runtime context。必须按包名引用：预设里的行以 profile 目录为解析基准。
